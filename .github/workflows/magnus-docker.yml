name: build-magnus-image
on:
  push:
    branches: [magnus]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            APP_VERSION=2.27.0
          tags: |
            ghcr.io/pedroocastilho/magnus-crm:magnus-2.27.0
            ghcr.io/pedroocastilho/magnus-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
